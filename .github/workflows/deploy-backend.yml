name: Deploy backend (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend

      - name: Sync secrets to the Worker
        working-directory: backend
        run: |
          put() {
            if [ -n "$2" ]; then
              echo "$2" | npx wrangler secret put "$1"
            else
              echo "$1 secret not set, skipping."
            fi
          }
          put BREVO_API_KEY "$BREVO_API_KEY"
          put GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          put GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
