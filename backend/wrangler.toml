name = "meridiangray-backend"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "348471314fadbd57e39a68b2eadb5984"

# The website API stays on workers.dev. The client portal (portal.) and the
# team's admin side (admin.) are served by this same Worker on their own
# subdomains; Cloudflare creates the DNS records.
workers_dev = true
routes = [
  { pattern = "portal.meridiangray.in", custom_domain = true },
  { pattern = "admin.meridiangray.in", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "meridiangray-db"
database_id = "99583afb-2906-4a64-a1cd-863813244d71"

[triggers]
# Daily — checks for confirmed bookings whose call happened 5+ days ago and
# unlocks/emails the full Health Check report for each. See unlockDueReports()
# and the `scheduled` export in src/index.js.
crons = ["0 3 * * *"]

[vars]
NOTIFY_EMAIL = "info@meridiangray.in"
# Must be a sender verified in this Brevo account (Senders & IPs). Confirmed via
# Brevo's own send log that "no-reply@meridiangray.in" was rejected on every single
# attempt since launch ("sender ... is not valid"); only info@meridiangray.in is
# verified on this account. Switch to a no-reply@ address once that's verified too.
SENDER_EMAIL = "info@meridiangray.in"
ALLOWED_ORIGIN = "https://www.meridiangray.in"
# Zoho CRM data center — the part after "zoho." in your CRM login URL
# (crm.zoho.in -> "in", crm.zoho.com -> "com", crm.zoho.eu -> "eu").
ZOHO_DC = "in"
# Client portal: who counts as Meridian Gray team (admin side). SHA-256 of each
# lowercase email, comma-separated -- hashes, so no addresses sit in the repo.
# To add someone: echo -n "name@example.com" | sha256sum
STAFF_EMAIL_HASHES = "15a58f899b0219c94639acdb87d0fe8ddc675f5458eca843d67ae9527f023544,8ba06899ad09a29a2d4b8c83c9120be07937df706292e33bb88a0ac24e88c680,7f5528800a989c162ef63a977e1b8d2bbcd876681b7f85622173db8b0bf898bf"

# Set the real secret after deploy with:
#   npx wrangler secret put BREVO_API_KEY

